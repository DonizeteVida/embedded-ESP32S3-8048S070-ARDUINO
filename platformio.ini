[platformio]
default_envs = esp32-s3-devkitc-1

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

extra_scripts = pre:scripts/codec_build.py
monitor_speed = 115200
; Select a named test environment explicitly; the demo is not a test runner.
test_ignore = *

lib_deps =
	lvgl/lvgl@9.6.0
    bitbank2/unzipLIB@1.0.0
    bitbank2/JPEGDEC@1.8.4
    https://github.com/bitbank2/PNGdec.git#64f9f3bc11cc1acb49f5bce823baae6ece910ba6

build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
    -DPNG_MAX_BUFFERED_PIXELS=32770
	-Iinclude

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.partitions = full_16mb.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.extra_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	#-DARDUINO_USB_CDC_ON_BOOT=1

; Production remains the default build. Tests provide their own entrypoints.
[env:native]
platform = native
lib_compat_mode = off
lib_ldf_mode = chain
extra_scripts = pre:scripts/codec_build.py
test_framework = unity
test_build_src = no
test_filter = native/*
lib_deps =
    lvgl/lvgl@9.6.0
    bitbank2/unzipLIB@1.0.0
    bitbank2/JPEGDEC@1.8.4
    https://github.com/bitbank2/PNGdec.git#64f9f3bc11cc1acb49f5bce823baae6ece910ba6
build_flags =
    -std=c++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DPNG_MAX_BUFFERED_PIXELS=32770
    -Iinclude
    -Itest/support/native

[env:hardware]
extends = env:esp32-s3-devkitc-1
test_ignore =
test_framework = unity
test_build_src = no
test_speed = 115200
test_filter = embedded/*

[env:hardware-guided]
extends = env:hardware
test_filter = guided/*

[env:hardware-soak]
extends = env:hardware
test_filter = soak/*

[env:hardware-card-absent]
extends = env:hardware
test_filter = card_absent/*

[env:hardware-card-unsupported]
extends = env:hardware
test_filter = card_unsupported/*

[env:hardware-reader]
extends = env:hardware
test_filter = reader/*

[env:hardware-reader-guided]
extends = env:hardware
test_filter = reader_guided/*

[env:hardware-reader-benchmark]
extends = env:hardware
test_filter = reader_benchmark/*

[env:hardware-reader-samples]
extends = env:hardware
test_filter = reader_samples/*
